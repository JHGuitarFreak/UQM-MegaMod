name: Build UQM-MegaMod Binaries

on:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'build/**'
      - 'CMakeLists.txt'
      - 'helpers.cmake'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'build/**'
      - 'CMakeLists.txt'
      - 'helpers.cmake'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v6
    
    - name: Install Linux Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          ninja-build \
          libsdl2-dev \
          libpng-dev \
          libogg-dev \
          libvorbis-dev \
          zlib1g-dev
    
    - name: Build Linux Binary
      run: |
        chmod +x cmake-build.sh
        ./cmake-build.sh
    
    - name: Upload Linux Artifact
      uses: actions/upload-artifact@v7
      with:
        name: UrQuanMastersDebug-Linux
        path: ./UrQuanMastersDebug
        if-no-files-found: error

  build-windows-64bit:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v6

    - name: Setup MSYS2 for 64-bit
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        install: >-
          base-devel
          mingw-w64-ucrt-x86_64-toolchain
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-ninja
          mingw-w64-ucrt-x86_64-SDL2
          mingw-w64-ucrt-x86_64-libpng
          mingw-w64-ucrt-x86_64-libogg
          mingw-w64-ucrt-x86_64-libvorbis
          mingw-w64-ucrt-x86_64-zlib
    
    - name: Build Windows 64-bit Binary
      shell: msys2 {0}
      run: ./cmake-build.sh
    
    - name: Upload Windows 64-bit Artifact
      uses: actions/upload-artifact@v7
      with:
        name: UrQuanMastersDebug-Windows
        path: ./UrQuanMastersDebug.exe
        if-no-files-found: error